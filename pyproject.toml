# 提示詞源碼樹不是要發布的套件：package = false 讓 uv 以虛擬專案管理依賴，
# 不要求 build-system、不打包本目錄。
[project]
name = "ex-minimal-project-py"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "promptex-py~=0.0.0",
  # 兩份擴展是本專案的一部分，以路徑來源掛上：Python 的 import 走發布名對應的
  # import 套件名，擴展因此仍是一份可安裝的發布單元，只是來源指向本專案目錄內。
  "ex-minimal-plugin-py",
  "ex-minimal-adapter-py",
]

[tool.uv]
package = false

[tool.uv.sources]
ex-minimal-plugin-py = { path = "plugins/ex-minimal-plugin-py", editable = true }
ex-minimal-adapter-py = { path = "adapters/ex-minimal-adapter-py", editable = true }
