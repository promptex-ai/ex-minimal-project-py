[project]
name = "ex-minimal-adapter-py"
version = "0.1.0"
description = "A third-party promptex platform adapter."
requires-python = ">=3.10"
dependencies = ["promptex-py~=0.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ex_minimal_adapter_py"]
